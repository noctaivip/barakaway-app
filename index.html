<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BarakaWay — выбор языка</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="desktop-web.css">
<style>
:root{color-scheme:dark;--bg:#071115;--card:#101b20;--gold:#d7b56d;--green:#2d7a46;--text:#eef7f2;--muted:#9dafaa;--border:rgba(215,181,109,.24)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -20%,rgba(215,181,109,.18),transparent 42%),linear-gradient(180deg,#071115,#0d171c 58%,#071115);color:var(--text)}
.lang-shell{width:min(1120px,calc(100% - 80px));margin:0 auto;padding:88px 0}
.lang-hero{text-align:center;padding:44px 34px 50px;border:1px solid var(--border);border-radius:34px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.022));box-shadow:0 30px 80px rgba(0,0,0,.32)}
.lang-logo{width:104px;height:104px;object-fit:contain;border-radius:28px;display:block;margin:0 auto 34px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;margin-top:0}
.lang-card{min-height:132px;border-radius:26px;border:1px solid rgba(215,181,109,.22);background:radial-gradient(circle at 80% 0%,rgba(215,181,109,.14),transparent 42%),linear-gradient(180deg,#132127,#0e181d);color:var(--text);text-decoration:none;padding:24px 18px;display:flex;flex-direction:column;justify-content:center;gap:10px;transition:.18s ease;box-shadow:0 16px 40px rgba(0,0,0,.18)}
.lang-card:hover{transform:translateY(-3px);border-color:rgba(215,181,109,.48);box-shadow:0 24px 56px rgba(0,0,0,.28)}
.lang-card strong{font-size:21px;line-height:1.15;color:#65e28f}
.lang-card span{color:#f4f1df;font-size:15px;font-weight:900}
.lang-card.ru{background:radial-gradient(circle at 80% 0%,rgba(215,181,109,.22),transparent 42%),linear-gradient(135deg,#173726,#101b20);border-color:rgba(215,181,109,.42)}

/* BarakaWay download modal */
.bw-index-modal{display:flex;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;padding:18px;background:rgba(3,10,8,.76);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .22s ease,visibility .22s ease}
.bw-index-modal.open{opacity:1;visibility:visible}
.bw-index-dialog{width:min(100%,520px);padding:24px 24px 22px;border-radius:28px;text-align:center;background:linear-gradient(180deg,#122118 0%,#0d1814 100%);border:1px solid rgba(215,181,109,.38);box-shadow:0 28px 70px rgba(0,0,0,.48)}
.bw-index-logo{width:72px;height:72px;object-fit:contain;display:block;margin:0 auto 14px;border-radius:20px;filter:drop-shadow(0 12px 24px rgba(0,0,0,.35))}
.bw-index-dialog h2{margin:0 0 8px;font-size:25px;line-height:1.2;color:#fff}
.bw-index-dialog p{margin:0 auto 18px;max-width:390px;color:#aebbb5;font-size:14px;line-height:1.55}
.bw-index-store-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.bw-index-store-link{width:178px;min-height:60px;padding:9px 14px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:11px;text-decoration:none;background:linear-gradient(180deg,#141b17,#0d1411);border:1px solid rgba(215,181,109,.38);box-shadow:inset 0 1px 0 rgba(255,255,255,.035);transition:transform .18s ease,border-color .18s ease}
.bw-index-store-link:hover{transform:translateY(-1px);border-color:rgba(215,181,109,.68)}
.bw-index-store-icon{width:30px;height:30px;display:grid;place-items:center;flex:0 0 30px}
.bw-index-store-icon svg{width:30px;height:30px;display:block}
.bw-index-store-copy{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05;text-align:left}
.bw-index-store-copy small{font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#98a39e}
.bw-index-store-copy strong{margin-top:4px;font-size:15px;color:#66ed98;white-space:nowrap}

.bw-index-stay-btn{background:transparent;border:none;color:#cfd8d3;font-size:15px;font-weight:700;cursor:pointer;padding:8px 12px;opacity:.9}
.bw-index-stay-btn:hover{color:#fff;text-decoration:underline}

@media(max-width:560px){.bw-index-dialog{padding:22px 16px 20px;border-radius:25px}.bw-index-store-actions{flex-wrap:nowrap;gap:8px}.bw-index-store-link{width:calc(50% - 4px);min-width:0;padding:8px 8px;gap:7px}.bw-index-store-icon,.bw-index-store-icon svg{width:26px;height:26px}.bw-index-store-copy small{font-size:8px}.bw-index-store-copy strong{font-size:13px}.bw-index-dialog h2{font-size:23px}}


@media(max-width:700px){
  body{
    min-height:100svh;
    overflow-x:hidden;
  }

  .lang-shell{
    width:100%;
    margin:0;
    padding:18px 14px 22px;
  }

  .lang-hero{
    width:100%;
    min-height:calc(100svh - 40px);
    padding:22px 14px 18px;
    border-radius:26px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  .lang-logo{
    width:82px;
    height:82px;
    margin:0 auto 20px;
    border-radius:22px;
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .lang-card{
    min-height:92px;
    padding:14px 10px;
    border-radius:20px;
    gap:6px;
    box-shadow:0 10px 24px rgba(0,0,0,.16);
  }

  .lang-card strong{
    font-size:18px;
  }

  .lang-card span{
    font-size:12px;
    line-height:1.25;
  }
}

@media(max-width:380px){
  .lang-shell{
    padding:12px 10px 16px;
  }

  .lang-hero{
    min-height:calc(100svh - 28px);
    padding:18px 10px 14px;
    border-radius:22px;
  }

  .lang-logo{
    width:72px;
    height:72px;
    margin-bottom:16px;
  }

  .grid{
    gap:8px;
  }

  .lang-card{
    min-height:82px;
    padding:11px 8px;
    border-radius:17px;
  }

  .lang-card strong{
    font-size:16px;
  }

  .lang-card span{
    font-size:11px;
  }
}

</style>

<script src="theme-init.js"></script>

<a class="lang-card" href="home-id.html"><strong>Indonesia</strong><span>Buka situs</span></a>
<a class="lang-card" href="home-hi.html"><strong>हिन्दी</strong><span>वेबसाइट खोलें</span></a>

<a class="lang-card" href="home-ur.html"><strong>اردو</strong><span>ویب سائٹ کھولیں</span></a>
</div>
</section>
</main>

</body>
</html>
