<script>
(function(){
  var modal=document.getElementById('bwIndexDownloadModal');
  var title=document.getElementById('bwIndexDownloadTitle');
  var text=document.getElementById('bwIndexDownloadText');
  var googleSmall=document.getElementById('bwGoogleSmall');
  var appleSmall=document.getElementById('bwAppleSmall');
  var stay=document.getElementById('bwIndexStayBtn');
  var selectedHref='';
  var translations={"ru": {"title": "Скачать приложение", "text": "Установите мобильное приложение BarakaWay.", "google": "Доступно в", "apple": "Загрузите в", "stay": "Остаться на сайте"}, "en": {"title": "Download the app", "text": "Install the BarakaWay mobile app.", "google": "Get it on", "apple": "Download on the", "stay": "Stay on the website"}, "ar": {"title": "حمّل التطبيق", "text": "ثبّت تطبيق BarakaWay على هاتفك.", "google": "متوفر على", "apple": "حمّله من", "stay": "البقاء في الموقع"}, "tr": {"title": "Uygulamayı indir", "text": "BarakaWay mobil uygulamasını yükleyin.", "google": "Şuradan edinin", "apple": "Şuradan indirin", "stay": "Web sitesinde kal"}, "uz": {"title": "Ilovani yuklab oling", "text": "BarakaWay mobil ilovasini o‘rnating.", "google": "Google Play orqali", "apple": "App Store orqali", "stay": "Saytda qolish"}, "kz": {"title": "Қосымшаны жүктеу", "text": "BarakaWay мобильді қосымшасын орнатыңыз.", "google": "Google Play-ден", "apple": "App Store-дан", "stay": "Сайтта қалу"}, "id": {"title": "Unduh aplikasi", "text": "Instal aplikasi seluler BarakaWay.", "google": "Dapatkan di", "apple": "Unduh di", "stay": "Tetap di situs"}, "hi": {"title": "ऐप डाउनलोड करें", "text": "BarakaWay मोबाइल ऐप इंस्टॉल करें।", "google": "यहाँ उपलब्ध", "apple": "यहाँ से डाउनलोड करें", "stay": "वेबसाइट पर रहें"}, "bn": {"title": "অ্যাপ ডাউনলোড করুন", "text": "BarakaWay মোবাইল অ্যাপ ইনস্টল করুন।", "google": "পাওয়া যাবে", "apple": "ডাউনলোড করুন", "stay": "ওয়েবসাইটে থাকুন"}, "ur": {"title": "ایپ ڈاؤن لوڈ کریں", "text": "BarakaWay موبائل ایپ انسٹال کریں۔", "google": "دستیاب ہے", "apple": "یہاں سے ڈاؤن لوڈ کریں", "stay": "ویب سائٹ پر رہیں"}};

  function openFor(lang, href){
    var t=translations[lang] || translations.en;
    selectedHref=href;
    title.textContent=t.title;
    text.textContent=t.text;
    googleSmall.textContent=t.google;
    appleSmall.textContent=t.apple;
    stay.textContent=t.stay;
    modal.classList.add('open');
    modal.setAttribute('aria-hidden','false');
  }

  function continueToSite(){
    if(selectedHref) window.location.href=selectedHref;
  }

  document.querySelectorAll('.lang-card').forEach(function(link){
    link.addEventListener('click',function(e){
      e.preventDefault();
      var href=this.getAttribute('href') || '';
      var match=href.match(/home-([a-z]{2})\.html/i);
      openFor(match ? match[1].toLowerCase() : 'en', href);
    });
  });

  stay.addEventListener('click',continueToSite);
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape' && modal.classList.contains('open')) continueToSite();
  });
})();
</script>
